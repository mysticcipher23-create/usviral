      <radialGradient id="glow" cx="70%" cy="18%" r="40%">
        <stop offset="0" stop-color="#7d1d3f" stop-opacity="0.55"/>
        <stop offset="1" stop-color="#7d1d3f" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1280" height="720" fill="url(#sky)"/>
