    <path d="M800 162 Q870 230 940 162" fill="none" stroke="#f4f1ea" stroke-width="4"/>
    <circle cx="870" cy="210" r="26" fill="#c4552a"/>
<rect width="1280" height="720" filter="url(#grain)"/>
</svg>